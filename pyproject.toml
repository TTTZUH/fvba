[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fvba-experiments"
version = "0.1.0"
description = "Controlled image-classification experiment pipeline"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0",
  "PyYAML>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
evaluation = ["lpips>=0.1.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fvba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
