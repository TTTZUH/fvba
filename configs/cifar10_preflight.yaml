experiment:
  name: cifar10_preflight
  method: fpba
  full_run: true
runtime:
  seed: 0
  device: auto
  allow_cpu_full_run: false
data:
  dataset: cifar10
  root: data
  download: true
  num_classes: 10
  batch_size: 2
  num_workers: 0
  max_batches: 1
attack:
  epsilon: 0.3137254901960784
  carriers_per_class: 2
  alpha: 0.5
  beta: 0.3
  gamma: 0.5
  dct: {block_size: 8, low_freq_size: 3, strength: 1.5}
model:
  anchor: resnet18
  victim: resnet18
  vit_name: vit_base_patch16_224.augreg_in21k
  vit_checkpoint: null
  allow_weight_download: false
  lcng_channels: [64, 128, 256, 512]
  embedding_dim: 512
training:
  anchor_epochs: 1
  linear_head_epochs: 1
  generator_epochs: 1
  stage1_epochs: 1
  stage2_epochs: 1
  victim_epochs: 1
  generator_lr: 0.0001
  victim_lr: 0.001
  momentum: 0.9
  weight_decay: 0.0005
evaluation: {require_lpips: false}
output: {dir: outputs/cifar10_preflight_min}
provenance:
  assumptions: [preflight_one_epoch, preflight_ten_batch_cap, batch_size, num_workers, weight_decay, lcng_architecture]
