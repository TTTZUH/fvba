experiment:
  name: offline_smoke
  method: fpba
  full_run: false
runtime:
  seed: 0
  device: cpu
  allow_cpu_full_run: true
data:
  dataset: synthetic
  root: data
  download: false
  num_classes: 2
  synthetic_size: 12
  image_size: 32
  batch_size: 4
  num_workers: 0
attack:
  epsilon: 0.2
  carriers_per_class: 2
  alpha: 0.5
  beta: 0.3
  gamma: 0.5
  dct: {block_size: 8, low_freq_size: 3, strength: 1.5}
model:
  anchor: tiny
  victim: tiny
  lcng_channels: [8, 16, 32, 64]
  embedding_dim: 32
training:
  anchor_epochs: 1
  linear_head_epochs: 1
  generator_epochs: 1
  stage1_epochs: 1
  stage2_epochs: 1
  victim_epochs: 1
  generator_lr: 0.001
  victim_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
evaluation: {require_lpips: false}
output: {dir: outputs/offline_smoke}
provenance:
  assumptions: [synthetic_data, tiny_models, reduced_epochs, batch_size]

